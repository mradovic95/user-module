databaseChangeLog:
  # Up to 0.0.10 the changelog seeded four VERIFIED users with fixed, published passwords (test-user-1..3 and
  # admin with ROLE_ADMIN) into every consumer's database. With password login and the password grant live that
  # is a known credential with admin rights, so the seed is gone and this removes rows it left behind — only
  # while their password is still the seeded hash, so an account somebody took over and re-keyed is kept.
  - changeSet:
      id: remove-seeded-users
      author: mradovic01011111@gmail.com
      changes:
        - sql:
            sql: >
              DELETE FROM users_roles WHERE user_id IN (SELECT id FROM user_table WHERE
              (username IN ('test-user-1', 'test-user-2', 'test-user-3')
              AND password = '$2a$10$9i1/tnC0VbnqkM/8XCDk0.slDworPf4twa2Q0NuNGhTKqnWaPiwPS')
              OR (username = 'admin'
              AND password = '$2a$10$r/ATO2I5L8I0XoyQDQC..Ombni29ReZTwzXSVKKT3QLBZODZlEHaS'));
              DELETE FROM user_table WHERE
              (username IN ('test-user-1', 'test-user-2', 'test-user-3')
              AND password = '$2a$10$9i1/tnC0VbnqkM/8XCDk0.slDworPf4twa2Q0NuNGhTKqnWaPiwPS')
              OR (username = 'admin'
              AND password = '$2a$10$r/ATO2I5L8I0XoyQDQC..Ombni29ReZTwzXSVKKT3QLBZODZlEHaS');
